name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name without registry prefix (e.g. template-backend)'
        required: true
        type: string
      kustomization_path:
        description: 'Path to kustomization.yaml inside platform-gitops'
        required: true
        type: string
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
      org:
        description: 'GitHub org / registry namespace'
        required: false
        type: string
        default: 'gino-dev-platform'
      gitops_repo:
        description: 'GitOps repository slug (org/repo)'
        required: false
        type: string
        default: 'gino-dev-platform/platform-gitops'
      gitops_username:
        description: 'Git username used to push to the gitops repo'
        required: false
        type: string
        default: 'ginojc'
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check GHCR_TOKEN
        id: preflight
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::GHCR_TOKEN not configured — skipping CI (expected on initial commit of new repos)"
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Generate image tag
        if: steps.preflight.outputs.ready == 'true'
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to registry
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.gitops_username }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image
        if: steps.preflight.outputs.ready == 'true'
        run: |
          docker build \
            -t ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:latest \
            -t ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:${{ steps.vars.outputs.sha_short }} \
            .

      - name: Push images
        if: steps.preflight.outputs.ready == 'true'
        run: |
          docker push ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:${{ steps.vars.outputs.sha_short }}

      - name: Make package public
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "--- Token debug ---"
          echo "Token length: ${#GH_TOKEN}"
          echo "Token prefix: ${GH_TOKEN:0:6}"
          echo "Authenticated as: $(gh api user --jq '.login')"
          echo "Token scopes: $(gh api rate_limit -i 2>&1 | grep -i 'x-oauth-scopes')"
          echo "--- API call ---"
          for i in 1 2 3; do
            echo "Attempt $i: PATCH /orgs/${{ inputs.org }}/packages/container/${{ inputs.image_name }}"
            gh api --method PATCH \
              "/orgs/${{ inputs.org }}/packages/container/${{ inputs.image_name }}" \
              -f visibility=public -v && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Update GitOps image tag
        if: steps.preflight.outputs.ready == 'true'
        run: |
          git clone https://${{ inputs.gitops_username }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ inputs.gitops_repo }}.git gitops

          cd gitops

          # Use | as sed delimiter to avoid escaping forward slashes in the image name
          sed -i "\|name: ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}|{n;s/newTag:.*/newTag: \"${{ steps.vars.outputs.sha_short }}\"/;}" ${{ inputs.kustomization_path }}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "update ${{ inputs.image_name }} image to ${{ steps.vars.outputs.sha_short }}"
          git push
