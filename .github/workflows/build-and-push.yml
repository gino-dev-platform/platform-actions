name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name without registry prefix (e.g. template-backend)'
        required: true
        type: string
      kustomization_path:
        description: 'Path to kustomization.yaml inside platform-gitops'
        required: true
        type: string
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
      org:
        description: 'GitHub org / registry namespace'
        required: false
        type: string
        default: 'gino-dev-platform'
      gitops_repo:
        description: 'GitOps repository slug (org/repo)'
        required: false
        type: string
        default: 'gino-dev-platform/platform-gitops'
      gitops_username:
        description: 'Git username used to push to the gitops repo'
        required: false
        type: string
        default: 'ginojc'
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check GHCR_TOKEN
        id: preflight
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::GHCR_TOKEN not configured — skipping CI (expected on initial commit of new repos)"
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Generate image tag
        if: steps.preflight.outputs.ready == 'true'
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to registry
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.gitops_username }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image
        if: steps.preflight.outputs.ready == 'true'
        run: |
          docker build \
            -t ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:latest \
            -t ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:${{ steps.vars.outputs.sha_short }} \
            .

      - name: Push images
        if: steps.preflight.outputs.ready == 'true'
        run: |
          docker push ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}:${{ steps.vars.outputs.sha_short }}

      - name: Make package public
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "--- Getting package node ID ---"
          PACKAGE_ID=$(gh api graphql \
            -f query='query($org: String!, $name: String!) {
              organization(login: $org) {
                packages(names: [$name], packageType: CONTAINER, first: 1) {
                  nodes { id visibility }
                }
              }
            }' \
            -f org="${{ inputs.org }}" \
            -f name="${{ inputs.image_name }}" \
            --jq '.data.organization.packages.nodes[0].id // empty')
          echo "Package ID: $PACKAGE_ID"

          echo "--- Available package mutations ---"
          gh api graphql \
            -f query='{ __schema { mutationType { fields { name } } } }' \
            --jq '[.data.__schema.mutationType.fields[].name | select(test("ackage";"i"))]'

          echo "--- Trying changePackageVisibility ---"
          gh api graphql \
            -f query='mutation($packageId: ID!) {
              changePackageVisibility(input: { packageId: $packageId, visibility: PUBLIC }) {
                package { visibility }
              }
            }' \
            -f packageId="$PACKAGE_ID"

      - name: Update GitOps image tag
        if: steps.preflight.outputs.ready == 'true'
        run: |
          git clone https://${{ inputs.gitops_username }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ inputs.gitops_repo }}.git gitops

          cd gitops

          # Use | as sed delimiter to avoid escaping forward slashes in the image name
          sed -i "\|name: ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image_name }}|{n;s/newTag:.*/newTag: \"${{ steps.vars.outputs.sha_short }}\"/;}" ${{ inputs.kustomization_path }}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "update ${{ inputs.image_name }} image to ${{ steps.vars.outputs.sha_short }}"
          git push
